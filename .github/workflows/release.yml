name: Publish release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.2.1)
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:launcher
      - name: Validate release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw "Tag does not match package version" }
      - run: npm test
      - run: npm run build
      - run: npm run test:audio
      - run: npm run test:native
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Verify install, upgrade and complete removal
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $env:ALLRADIONE_SMOKE_INSTALLER = "release/Allradione-Setup-$version-x64.exe"
          npm run test:installer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Allradione-UI-verification
          path: artifacts/
          retention-days: 14
      - name: Hash and attach release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          $assets = Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe' }
          $assets | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt -Encoding utf8NoBOM
          gh release upload $env:RELEASE_TAG $assets.FullName release/SHA256SUMS.txt --clobber
