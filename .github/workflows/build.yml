name: Build Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:launcher
      - run: npm test
      - run: npm run build
      - run: npm run test:audio
      - run: npm run test:native
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Verify install, upgrade and complete removal
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $env:ALLRADIONE_SMOKE_INSTALLER = "release/Allradione-Setup-$version-x64.exe"
          npm run test:installer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Allradione-UI-verification
          path: artifacts/
          retention-days: 14
      - name: Write SHA256 checksums
        shell: pwsh
        run: |
          Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: Allradione-Windows
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          retention-days: 14
